[project]
name = "reversallab"
version = "0.1.0.dev0"
description = "Statistically grounded off-policy evaluation and deployment-decision robustness analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ReversalLab contributors" }]
keywords = [
    "causal-inference",
    "contextual-bandits",
    "decision-reversal",
    "doubly-robust",
    "off-policy-evaluation",
    "reinforcement-learning",
    "robust-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
]

[project.urls]
Homepage = "https://github.com/koushik-ngd/reversal-lab"
Documentation = "https://github.com/koushik-ngd/reversal-lab#readme"
Repository = "https://github.com/koushik-ngd/reversal-lab.git"
Issues = "https://github.com/koushik-ngd/reversal-lab/issues"
Changelog = "https://github.com/koushik-ngd/reversal-lab/blob/master/CHANGELOG.md"

[project.scripts]
reversallab = "reversallab.cli:main"
reversallab-service = "reversallab.cli:main_service"

[project.optional-dependencies]
service = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "mypy>=1.10",
    "nbclient>=0.11.0",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reversallab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "statistical: Monte Carlo checks against synthetic ground truth (slower, deterministic seeds)",
]
filterwarnings = [
    "ignore::RuntimeWarning:zmq.*",
    "ignore::Warning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]
exclude = ["experiments", "data", "runs", "dist", ".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "examples.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
