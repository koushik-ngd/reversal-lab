name: "007_independent_reliability"
description: "Milestone M4C Independent Reliability Benchmark comparing Methods A-F across 10 preregistered scenarios."
seed: 42
n_replications: 500
confidence_level: 0.95
n_folds: 3
deploy_threshold_epsilon: 0.10
reference_n_contexts: 50000

scenarios:
  - name: "robust_true_improvement"
    description: "Candidate strongly dominates baseline in both strata; no reversal within bounds."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 2
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 1.5
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "fragile_margin_crossing"
    description: "Candidate beats baseline at sample mixture, but reverses below margin at distance < eps_deploy."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 3
      inverse_temperature: 1.5
    baseline_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 49
      inverse_temperature: 1.5
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "severe_performance_reversal"
    description: "Perturbation causes candidate to actively perform worse than baseline (Delta*(q) < 0) within admissible bounds."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 1
      inverse_temperature: 1.5
    baseline_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 34
      inverse_temperature: 1.5
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "truly_harmful_candidate"
    description: "Candidate policy is strictly worse than baseline everywhere (Delta*(q) < 0); tests confident rejection and safety."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 2
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "uniform"
    baseline_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 1.5
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "near_zero_null_advantage"
    description: "Candidate and baseline have identical uniform policies (true Delta = 0 < margin); tests null false recommendation rate."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 2
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "uniform"
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "decision_without_perf_reversal"
    description: "Candidate is superior in both strata, but drops below margin without harming any subpopulation (Delta_i > 0)."
    n_samples: 2000
    margin: 0.03
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 1
      inverse_temperature: 1.5
    baseline_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 2
      inverse_temperature: 1.5
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "poor_overlap_propensity_deficit"
    description: "Concentrated logging policy causes severe propensity deficit, tripping diagnostic gate."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 777
      inverse_temperature: 4.0
    candidate_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 1.5
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.02

  - name: "misspecified_reward_model_robust"
    description: "Robust improvement evaluated under misspecified reward model to benchmark DR cross-fitting resilience."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 2
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 1.5
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "misspecified"
    min_propensity_threshold: 0.0001

  - name: "misspecified_reward_model_fragile"
    description: "Fragile improvement evaluated under misspecified reward model to benchmark boundary estimation."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 2
      inverse_temperature: 1.5
    baseline_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 22
      inverse_temperature: 1.5
    reward_model:
      specification: "misspecified"
    min_propensity_threshold: 0.0001

  - name: "equal_strata_no_reversal"
    description: "Both strata have identical positive advantage just above margin; zero slope tests linear degeneracy."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 2
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 0.4
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001
