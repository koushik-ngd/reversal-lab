name: "006_reversal_reliability"
description: "Milestone M4B-1 Decision-Reversal Reliability Benchmark comparing Methods A-E across 7 scenarios."
seed: 42
n_replications: 20
confidence_level: 0.95
n_folds: 3
deploy_threshold_epsilon: 0.10
reference_n_contexts: 50000

scenarios:
  - name: "robust_true_improvement"
    description: "Candidate strongly dominates baseline in both strata; no reversal within bounds."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 2
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 1.5
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "fragile_near_margin"
    description: "Candidate beats baseline at sample mixture, but reverses below margin at small distance < eps_deploy."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 1
      inverse_temperature: 1.5
    baseline_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 6
      inverse_temperature: 1.5
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "genuine_performance_reversal"
    description: "Perturbation causes candidate to actively perform worse than baseline (Delta*(q) < 0) within admissible bounds."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 9
      inverse_temperature: 1.5
    baseline_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 1
      inverse_temperature: 1.5
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "decision_without_perf_reversal"
    description: "Candidate is strictly superior in both strata (Delta_i > 0), but drops below margin without harming any subpopulation."
    n_samples: 2000
    margin: 0.03
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 4
      inverse_temperature: 1.5
    baseline_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 3
      inverse_temperature: 1.5
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "high_uncertainty"
    description: "True improvement is positive, but small sample N=60 produces wide confidence intervals spanning margin."
    n_samples: 60
    margin: 0.03
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 2
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 1.5
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001

  - name: "poor_overlap"
    description: "Concentrated logging policy causes propensity deficit below threshold, tripping diagnostic gate."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 3
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "softmax"
      scores: "random"
      score_seed: 777
      inverse_temperature: 4.0
    candidate_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 1.5
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.02

  - name: "equal_strata_near_boundary"
    description: "Both strata have identical positive advantage just above margin; zero slope tests linear degeneracy."
    n_samples: 2000
    margin: 0.02
    max_epsilon: 0.40
    split_dim: 0
    split_threshold: 0.0
    environment:
      n_actions: 2
      context_dim: 2
      reward_type: "binary"
      reward_scale: 1.5
      bias_scale: 0.0
    logging_policy:
      kind: "uniform"
    candidate_policy:
      kind: "softmax"
      scores: "reward"
      inverse_temperature: 0.4
    baseline_policy:
      kind: "uniform"
    reward_model:
      specification: "correct"
      alpha: 1.0
    min_propensity_threshold: 0.0001
