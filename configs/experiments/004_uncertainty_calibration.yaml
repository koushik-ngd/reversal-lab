name: "004_uncertainty_calibration"
description: >
  Statistical uncertainty, confidence interval calibration, and reliability
  benchmarking for IPS, SNIPS, Direct Method (DM), and Doubly Robust (DR).
  Compares asymptotic Wald intervals against nonparametric bootstrap intervals
  across good/poor overlap, correct/misspecified models, and small/moderate sample sizes.
seed: 20261030
n_replications: 100
n_bootstraps: 50
n_folds: 3
confidence_level: 0.95
reference_n_contexts: 500000

uncertainty_methods:
  - ips_wald
  - snips_wald
  - dm_naive_wald
  - dr_influence_wald
  - ips_bootstrap_percentile
  - snips_bootstrap_percentile
  - dm_bootstrap_refit_percentile
  - dr_bootstrap_refit_percentile
  - dr_bootstrap_refit_basic

scenarios:
  - name: good_overlap_correct_model
    description: "Uniform logging with informed softmax candidate; correctly specified reward model."
    n_samples: [500, 2000]
    environment:
      n_actions: 5
      context_dim: 4
      reward_type: binary
      reward_scale: 1.0
      bias_scale: 0.2
    logging_policy:
      kind: uniform
    evaluation_policy:
      kind: softmax
      inverse_temperature: 1.5
      scores: reward
    reward_model:
      specification: correct
      alpha: 1.0
      standardize: true
    diagnostics:
      min_ess_fraction: 0.1
      max_weight_share: 0.05
      mean_weight_z: 4.0

  - name: good_overlap_misspecified_model
    description: "Uniform logging with informed candidate; misspecified reward model. Tests double robustness."
    n_samples: [500, 2000]
    environment:
      n_actions: 5
      context_dim: 4
      reward_type: binary
      reward_scale: 1.0
      bias_scale: 0.2
    logging_policy:
      kind: uniform
    evaluation_policy:
      kind: softmax
      inverse_temperature: 1.5
      scores: reward
    reward_model:
      specification: misspecified
    diagnostics:
      min_ess_fraction: 0.1
      max_weight_share: 0.05
      mean_weight_z: 4.0

  - name: poor_overlap_correct_model
    description: "Confident random logger against informed candidate; correctly specified reward model."
    n_samples: [500, 2000]
    environment:
      n_actions: 5
      context_dim: 4
      reward_type: binary
      reward_scale: 1.0
      bias_scale: 0.2
    logging_policy:
      kind: softmax
      inverse_temperature: 2.0
      scores: random
      score_seed: 314
    evaluation_policy:
      kind: softmax
      inverse_temperature: 2.0
      scores: reward
    reward_model:
      specification: correct
      alpha: 1.0
      standardize: true
    diagnostics:
      min_ess_fraction: 0.1
      max_weight_share: 0.05
      mean_weight_z: 4.0

  - name: poor_overlap_misspecified_model
    description: "Confident random logger against informed candidate; misspecified reward model."
    n_samples: [500, 2000]
    environment:
      n_actions: 5
      context_dim: 4
      reward_type: binary
      reward_scale: 1.0
      bias_scale: 0.2
    logging_policy:
      kind: softmax
      inverse_temperature: 2.0
      scores: random
      score_seed: 314
    evaluation_policy:
      kind: softmax
      inverse_temperature: 2.0
      scores: reward
    reward_model:
      specification: misspecified
    diagnostics:
      min_ess_fraction: 0.1
      max_weight_share: 0.05
      mean_weight_z: 4.0

  - name: continuous_reward_good_overlap
    description: "Gaussian continuous rewards with uniform logging; correctly specified Ridge reward model."
    n_samples: [500, 2000]
    environment:
      n_actions: 5
      context_dim: 4
      reward_type: gaussian
      reward_scale: 1.0
      bias_scale: 0.2
      noise_std: 1.0
    logging_policy:
      kind: uniform
    evaluation_policy:
      kind: softmax
      inverse_temperature: 1.5
      scores: reward
    reward_model:
      specification: correct
      alpha: 1.0
      standardize: true
    diagnostics:
      min_ess_fraction: 0.1
      max_weight_share: 0.05
      mean_weight_z: 4.0

  - name: continuous_reward_misspecified
    description: "Gaussian continuous rewards with uniform logging; misspecified reward model."
    n_samples: [500, 2000]
    environment:
      n_actions: 5
      context_dim: 4
      reward_type: gaussian
      reward_scale: 1.0
      bias_scale: 0.2
      noise_std: 1.0
    logging_policy:
      kind: uniform
    evaluation_policy:
      kind: softmax
      inverse_temperature: 1.5
      scores: reward
    reward_model:
      specification: misspecified
    diagnostics:
      min_ess_fraction: 0.1
      max_weight_share: 0.05
      mean_weight_z: 4.0
